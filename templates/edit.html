<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Event</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
    <h1>Edit Event</h1>
    <form class="event-form" method="post">
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <label for="name">Event Name</label>
        <input id="name" name="name" value="{{ event.name }}" required>
        <label for="date">Event Date</label>
        <input id="date" name="date" type="date" value="{{ event.date }}" required>
        <label for="description">Event Description</label>
        <textarea id="description" name="description" rows="3" required>{{ event.description }}</textarea>
        <button class="button edit" type="submit">Save Changes</button>
        <a href="{{ url_for('index') }}">Cancel</a>
    </form>
</main>
</body>
</html>
